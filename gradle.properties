# ---------------------------------------------------------------------------
# EcoWatch local server address
# ---------------------------------------------------------------------------
# The API address is compiled into the app, and 10.0.2.2 (the default) only
# exists inside the Android emulator. On a real phone that is an unroutable
# address, and every request fails with:
#
#   SocketTimeoutException: failed to connect to /10.0.2.2 (port 5000)
#
# so the value below points at this machine on the local network. It is read the
# same way whether the build comes from Android Studio's Run button or the command
# line, which is why a plain Run now works.
#
# The router can hand this machine a different address at any time. When that
# happens the app stops connecting and this line needs updating. To check:
#
#   Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias "Wi-Fi" |
#     Where-Object { $_.IPAddress -like '192.168.*' } | Select-Object IPAddress
#
# To build for one specific address without editing this file:
#
#   gradlew installDebug -PecowatchApiBaseUrl=http://<other-ip>:5000/api/
#
# Note: an emulator can also reach this LAN address, so this value is safe for
# both the phone and the emulator.
ecowatchApiBaseUrl=http://192.168.1.11:5000/api/